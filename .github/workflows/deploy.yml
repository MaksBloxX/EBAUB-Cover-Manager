name: Test HTML/JS & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Essential Files Exist
        run: |
          echo "Checking essential project files..."
          test -f index.html || (echo "Error: index.html missing!" && exit 1)
          test -f css/style.css || (echo "Error: css/style.css missing!" && exit 1)
          test -f js/app.js || (echo "Error: js/app.js missing!" && exit 1)
          test -d vendor || (echo "Error: vendor/ folder is missing!" && exit 1)
          echo "✔ All core files and vendor libs exist!"

      - name: Check HTML Syntax
        continue-on-error: true
        run: |
          npx htmlhint index.html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
